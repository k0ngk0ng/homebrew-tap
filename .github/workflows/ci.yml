name: Install packages
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_CACHE: ${{ github.workspace }}/.cache/homebrew
      HOMEBREW_LOGS: ${{ github.workspace }}/.cache/logs
      HOMEBREW_TEMP: ${{ github.workspace }}/.cache/tmp
    steps:
      - uses: actions/checkout@v4
      # setup-homebrew checks out the tap again; stage updates only afterward.
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7
        with:
          stable: true
      - uses: actions/download-artifact@v4
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
      - name: Verify generated formulas
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/sync.py --check
      - name: Install this checkout and exercise plugin dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOMEBREW_CACHE" "$HOMEBREW_LOGS" "$HOMEBREW_TEMP"
          brew install k0ngk0ng/tap/wire-connect k0ngk0ng/tap/wire-download
          brew test k0ngk0ng/tap/wirectl k0ngk0ng/tap/wire-connect k0ngk0ng/tap/wire-download
          test "$(wirectl connect version)" = "$(wirectl-connect version)"
          test "$(wirectl download version)" = "$(wirectl-download version)"
          prefix="$(brew --prefix wire-connect)"
          test -s "$prefix/etc/bash_completion.d/wirectl"
          test -L "$prefix/etc/bash_completion.d/wirectl-connect"
          head -1 "$prefix/share/zsh/site-functions/_wirectl" | grep -Fx '#compdef wirectl wirectl-connect'
          bash -n "$prefix/etc/bash_completion.d/wirectl"
          if command -v zsh >/dev/null; then
            zsh -n "$prefix/share/zsh/site-functions/_wirectl"
          fi
          download_prefix="$(brew --prefix wire-download)"
          test ! -e "$download_prefix/bin/wirectl"
          test ! -e "$download_prefix/etc/bash_completion.d/wirectl"
          test ! -e "$download_prefix/share/zsh/site-functions/_wirectl"
          test -x "$download_prefix/libexec/wirectl-download/bin/aria2c"
          test -x "$download_prefix/libexec/wirectl-download/bin/amuled"
          test -x "$download_prefix/libexec/wirectl-download/bin/amulecmd"
          test -s "$download_prefix/etc/bash_completion.d/wirectl-download"
          test -s "$download_prefix/share/fish/vendor_completions.d/wirectl-download.fish"
          head -1 "$download_prefix/share/zsh/site-functions/_wirectl-download" | grep -Fx '#compdef wirectl-download'
          bash -n "$download_prefix/etc/bash_completion.d/wirectl-download"
          bash -c '
            set -e
            source "$1"
            original=$(complete -p wirectl)
            source "$2"
            test "$(complete -p wirectl)" = "$original"
            COMP_WORDS=(wirectl-download search --type to)
            COMP_CWORD=3
            _wirectl_download_completion
            test "${COMPREPLY[*]}" = torrent
          ' -- "$prefix/etc/bash_completion.d/wirectl" "$download_prefix/etc/bash_completion.d/wirectl-download"
          if command -v zsh >/dev/null; then
            zsh -n "$download_prefix/share/zsh/site-functions/_wirectl-download"
          fi
          brew reinstall k0ngk0ng/tap/wire-connect k0ngk0ng/tap/wire-download
          brew test k0ngk0ng/tap/wire-connect k0ngk0ng/tap/wire-download
          brew uninstall wire-connect wire-download wirectl
