name: Install packages
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_CACHE: ${{ github.workspace }}/.cache/homebrew
      HOMEBREW_LOGS: ${{ github.workspace }}/.cache/logs
      HOMEBREW_TEMP: ${{ github.workspace }}/.cache/tmp
    steps:
      - uses: actions/checkout@v4
      # setup-homebrew checks out the tap again; stage updates only afterward.
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7
        with:
          stable: true
      - uses: actions/download-artifact@v4
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
      - name: Verify generated formulas
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/sync.py --check
      - name: Install this checkout and exercise plugin dispatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOMEBREW_CACHE" "$HOMEBREW_LOGS" "$HOMEBREW_TEMP"
          brew install k0ngk0ng/tap/wire-connect
          brew test k0ngk0ng/tap/wirectl k0ngk0ng/tap/wire-connect
          test "$(wirectl connect version)" = "$(wirectl-connect version)"
          prefix="$(brew --prefix wire-connect)"
          test -s "$prefix/etc/bash_completion.d/wirectl"
          test -L "$prefix/etc/bash_completion.d/wirectl-connect"
          head -1 "$prefix/share/zsh/site-functions/_wirectl" | grep -Fx '#compdef wirectl wirectl-connect'
          bash -n "$prefix/etc/bash_completion.d/wirectl"
          if command -v zsh >/dev/null; then
            zsh -n "$prefix/share/zsh/site-functions/_wirectl"
          fi
          brew reinstall k0ngk0ng/tap/wire-connect
          brew test k0ngk0ng/tap/wire-connect
          brew uninstall wire-connect wirectl
